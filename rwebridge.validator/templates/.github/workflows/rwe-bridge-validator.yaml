name: RWE-BRIDGE Metadata Validator

env:
  CONFIG_PATH: configuration/rwe-bridge-validator-config.yaml
  VALIDATOR_SCRIPT: '.github/workflows/validate_rwe_bridge.R'
  RESULTS_FILE: validation_results.rds

on:
  push:
    branches: [ main ]
    paths:
      - 'data/**'
      - 'configuration/rwe-bridge-validator-config.yaml'
      - '.github/workflows/rwe-bridge-validator.yaml'
      - '.github/workflows/validate_rwe_bridge.R'
      - 'run/run_rwe_bridge_validator.R'
  pull_request:
    branches:
      - '**'
    paths:
      - 'data/**'
      - 'configuration/rwe-bridge-validator-config.yaml'
      - '.github/workflows/rwe-bridge-validator.yaml'
      - '.github/workflows/validate_rwe_bridge.R'
      - 'run/run_rwe_bridge_validator.R'
  workflow_dispatch:

jobs:
  validate-metadata:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'latest'

      - name: Install R dependencies
        run: |
          install.packages(c("data.table", "yaml"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Run RWE-BRIDGE Validator
        run: Rscript run/run_rwe_bridge_validator.R
